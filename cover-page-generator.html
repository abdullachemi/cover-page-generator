<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অ্যাসাইনমেন্ট কভার পেজ জেনারেটর</title>
<style>
  :root{
    --ink:#1b2a22; --muted:#5d6b63; --line:#cfd8d2; --bg:#eef2ef; --card:#fff; --accent:#0a7d45;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Segoe UI",system-ui,sans-serif;}
  .app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;padding:20px;max-width:1280px;margin:0 auto;align-items:start}
  @media (max-width:900px){.app{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .panel h1{font-size:18px;margin:0 0 4px}
  .panel p.sub{margin:0 0 14px;color:var(--muted);font-size:13px}
  fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 14px;padding:10px 12px 12px}
  legend{padding:0 6px;font-weight:600;font-size:14px;color:var(--accent)}
  label{display:block;font-size:13px;margin-top:8px;color:var(--muted)}
  input[type=text],input[type=date]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px;margin-top:3px;background:#fff;color:var(--ink)}
  input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  input[type=file]{font-size:13px;margin-top:4px;max-width:100%}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;font-size:14px;padding:9px 14px;border-radius:7px;border:1px solid var(--accent);cursor:pointer}
  .primary{background:var(--accent);color:#fff}
  .ghost{background:#fff;color:var(--accent)}
  .preview-wrap{overflow:hidden;display:flex;justify-content:center}
  #scaler{transform-origin:top left}

  /* ---------- A4 page (794 x 1123 px) ---------- */
  .page{width:794px;height:1123px;background:#fff;position:relative;color:#000;
        font-family:"Times New Roman","Liberation Serif",Times,serif;box-shadow:0 2px 14px rgba(0,0,0,.18)}
  .frame{position:absolute;left:32px;top:35px;right:32px;bottom:35px;border:1px solid #000}
  .uni-title{position:absolute;top:96px;left:0;right:0;text-align:center;font-weight:700;font-size:27px;margin:0}
  .logo{position:absolute;top:150px;left:0;right:0;text-align:center}
  .logo img{height:180px;width:auto;max-width:240px;object-fit:contain}
  .assign{position:absolute;top:385px;left:0;right:0;text-align:center;font-size:21px;line-height:26px}
  .assign div{min-height:26px}
  table.sub{position:absolute;top:615px;left:72px;width:661px;border-collapse:collapse;font-size:18px}
  table.sub th,table.sub td{border:1px solid #000;vertical-align:middle}
  table.sub th{font-size:18px;font-weight:700;text-align:center;height:33px;padding:0}
  table.sub td{padding:10px 8px;line-height:32px;height:210px}
  table.sub td div{line-height:32px}
  table.sub td.l{width:49%}
  .small{font-size:17px;letter-spacing:-.2px}
  .date{position:absolute;top:925px;left:96px;font-size:19px}
  .date b{font-size:19px}
  .date span{font-size:15px;margin-left:12px}

  @media print{
    @page{size:A4;margin:0}
    body{background:#fff}
    .app{display:block;padding:0;max-width:none}
    .panel{display:none}
    .preview-wrap{display:block;overflow:visible}
    #scaler{transform:none!important;width:auto!important;height:auto!important}
    .page{box-shadow:none;margin:0}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ইনপুট ফর্ম -->
  <section class="panel" aria-label="তথ্য ইনপুট">
    <h1>কভার পেজ তথ্য</h1>
    <p class="sub">ডানে সঙ্গে সঙ্গে পেজ বদলাবে।</p>

    <fieldset>
      <legend>বিশ্ববিদ্যালয় ও কোর্স</legend>
      <label>বিশ্ববিদ্যালয়ের নাম
        <input type="text" id="uni" value="Khulna University of Engineering & Technology"></label>
      <label>লোগো (ছবি আপলোড করলে বদলে যাবে)
        <input type="file" id="logoFile" accept="image/*"></label>
      <label>ডকুমেন্টের ধরন
        <input type="text" id="kind" value="An Assignment"></label>
      <label>কোর্স টাইটেল
        <input type="text" id="ctitle" value="Chemistry of Polymer"></label>
      <label>কোর্স কোড
        <input type="text" id="ccode" value="Chem 6202"></label>
    </fieldset>

    <fieldset>
      <legend>Submitted By</legend>
      <label>নাম <input type="text" id="sname" value="K Abdulla"></label>
      <label>রোল <input type="text" id="roll" value="2653509"></label>
      <label>সেশন <input type="text" id="session" value="January/2026"></label>
      <label>বিভাগ <input type="text" id="sdept" value="Department of Chemistry"></label>
      <label>প্রতিষ্ঠান <input type="text" id="suni" value="Khulna University of Engineering & Technology"></label>
    </fieldset>

    <fieldset>
      <legend>Submitted To</legend>
      <label>শিক্ষকের নাম <input type="text" id="tname" value="Dr. Md. Mizanur Rahman Badal"></label>
      <label>পদবি <input type="text" id="tdesig" value="Professor"></label>
      <label>বিভাগ <input type="text" id="tdept" value="Department of Chemistry,"></label>
      <label>প্রতিষ্ঠান <input type="text" id="tuni" value="Khulna University of Engineering & Technology"></label>
    </fieldset>

    <fieldset>
      <legend>জমার তারিখ</legend>
      <label>তারিখ বাছুন <input type="date" id="dpick"></label>
      <label>অথবা হাতে লিখুন (যেমন: 15/08/2026)
        <input type="text" id="dtext" placeholder="dd/mm/yyyy"></label>
    </fieldset>

    <div class="btns">
      <button class="primary" id="printBtn">PDF সেভ / প্রিন্ট</button>
      <button class="ghost" id="resetBtn">রিসেট</button>
    </div>
  </section>

          <div>on</div>
          <div>Course Title: <span id="o_ctitle"></span></div>
          <div>Course Code: <span id="o_ccode"></span></div>
        </div>
        <table class="sub">
          <tr><th>Submitted By</th><th>Submitted To</th></tr>
          <tr>
            <td class="l">
              <div id="o_sname"></div>
              <div>Roll: <span id="o_roll"></span></div>
              <div>Session: <span id="o_session"></span></div>
              <div id="o_sdept"></div>
              <div class="small" id="o_suni"></div>
            </td>
            <td>
              <div id="o_tname"></div>
              <div id="o_tdesig"></div>
              <div id="o_tdept"></div>
              <div class="small" id="o_tuni"></div>

          </tr>
        </table>

      </div>

</div>

<script>
const $ = id => document.getElementById(id);
const defaults = {};
const map = {uni:'o_uni',kind:'o_kind',ctitle:'o_ctitle',ccode:'o_ccode',sname:'o_sname',roll:'o_roll',
  session:'o_session',sdept:'o_sdept',suni:'o_suni',tname:'o_tname',tdesig:'o_tdesig',tdept:'o_tdept',tuni:'o_tuni'};
const defaultLogo = $('o_logo').src;

function render(){
  for(const [i,o] of Object.entries(map)) $(o).textContent = $(i).value;
  let d = $('dtext').value.trim();
  if(!d && $('dpick').value){
    const [y,m,dd] = $('dpick').value.split('-'); d = `${dd}/${m}/${y}`;
  }
  $('o_date').textContent = d;
}
Object.keys(map).concat(['dtext','dpick']).forEach(i=>{
  defaults[i] = $(i).value;
  $(i).addEventListener('input', render);
});
$('dpick').addEventListener('input', ()=>{ $('dtext').value=''; render(); });

$('logoFile').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ $('o_logo').src = r.result; };
  r.readAsDataURL(f);
});

$('printBtn').addEventListener('click', ()=>window.print());
$('resetBtn').addEventListener('click', ()=>{
  for(const k in defaults) $(k).value = defaults[k];
  $('o_logo').src = defaultLogo; $('logoFile').value='';
  render();
});

// স্ক্রিনে পেজ ছোট করে দেখানোর জন্য স্কেল
function fit(){
  const wrap = $('wrap'), sc = $('scaler');
  const s = Math.min(1, wrap.clientWidth / 794);
  sc.style.transform = `scale(${s})`;
  sc.style.width = 794*s + 'px';
  sc.style.height = 1123*s + 'px';
  sc.querySelector('.page').style.transformOrigin = 'top left';
}
window.addEventListener('resize', fit);
window.addEventListener('beforeprint', ()=>{ $('scaler').style.transform='none'; });
window.addEventListener('afterprint', fit);
render(); fit();
</script>
